name: Lead-Radar sammeln

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten (GitHub startet manchmal etwas verspätet)
  workflow_dispatch: {}       # "Run workflow"-Knopf zum manuellen Starten

permissions:
  contents: write

concurrency:
  group: lead-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Feeds abrufen
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          GOOGLE_ALERTS_FEEDS: ${{ secrets.GOOGLE_ALERTS_FEEDS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
        run: python collect.py
      - name: leads.json speichern
        run: |
          git config user.name "lead-radar-bot"
          git config user.email "lead-radar-bot@users.noreply.github.com"
          git add leads.json
          git diff --cached --quiet || git commit -m "Leads aktualisiert $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
