name: Lead-Radar sammeln

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten (GitHub startet manchmal etwas verspätet)
  workflow_dispatch: {}       # "Run workflow"-Knopf zum manuellen Starten

permissions:
  contents: write

concurrency:
  group: lead-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Feeds abrufen
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python collect.py
      - name: leads.json speichern
        run: |
          git config user.name "lead-radar-bot"
          git config user.email "lead-radar-bot@users.noreply.github.com"
          git add leads.json
          git diff --cached --quiet || git commit -m "Leads aktualisiert $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
